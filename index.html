<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>证件水印</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="给身份证/证件照片加防盗用水印，图片仅在本地浏览器处理，绝不上传服务器。">
    <meta name="theme-color" content="#2c3e50">
    <style>
        body {
            margin: 12px auto;
            max-width: min(500px, 92vw);
            font-family: sans-serif;
            color: #2c3e50;
        }

        img, canvas {
            border: 3px solid #2c3e50;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        canvas {
            height: 0;
            display: block;
            cursor: crosshair;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .actions button {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #2c3e50;
            border-radius: 5px;
            background: #fff;
            color: #2c3e50;
            font-size: 14px;
            cursor: pointer;
        }

        .actions button:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        label, a {
            display: flex;
            align-items: center;
            margin-top: 8px;
        }

        label > input {
            margin-left: 4px;
        }

        .tip {
            font-size: 12px;
            color: #7f8c8d;
            margin: 8px 0;
            line-height: 1.5;
        }

        #save {
            justify-content: center;
            margin-top: 16px;
            padding: 10px;
            background: #2c3e50;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }

        /* 拖拽图片到页面时的高亮 */
        body.dragging {
            outline: 4px dashed #2c3e50;
            outline-offset: -8px;
        }

        body.dragging::after {
            content: "松手即可打开图片";
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #2c3e50;
            background: rgba(255, 255, 255, .75);
            pointer-events: none;
        }
    </style>
</head>
<body>
<canvas></canvas>
<div>
    <input id="upload-input" type="file" accept="image/*">
    <p class="tip">🔒 图片仅在本地浏览器处理，不会上传到任何服务器。<br>也可直接把图片拖拽到本页任意位置；打开图片后在画布上涂抹即可打马赛克。</p>
    <label>
        马赛克粗细：
        <input id="mosaic-brush" type="range" min="1" max="15" value="5">
    </label>
    <label>
        马赛克粒度：
        <input id="mosaic-block" type="range" min="1" max="10" value="3">
    </label>
    <div class="actions">
        <button id="mosaic-undo" type="button" disabled>撤销马赛克</button>
        <button id="mosaic-clear" type="button" disabled>清除马赛克</button>
    </div>
    <label>
        水印文字：
        <input id="content" type="text" value="仅供XX实名认证使用">
    </label>
    <label>
        水印颜色：
        <input id="color" type="color" value="#ffffff">
    </label>
    <label>
        不透明度：
        <input id="alpha" type="range" min="10" max="100" value="50">
    </label>
    <label>
        水印大小比：
        <input id="size" type="range" min="3" max="10" value="5">
    </label>
    <label>
        水印间隔比：
        <input id="gap" type="range" min="20" max="300" value="150">
    </label>
    <label>
        水印字体：
        <input id="font" type="text" value="sans-serif">
    </label>
    <a id="save" href="javascript:alert('请先打开图片')" download="证件水印.png">保存图片</a>
</div>
<script>
    var img = null;
    var strokes = [];
    var activeStroke = null;
    var mosaicTileCanvas = document.createElement('canvas');
    var mosaicMaskCanvas = document.createElement('canvas');
    var cachedTileImg = null;
    var cachedBlockSize = 0;
    var STORE_KEY = 'watermark-settings';
    var SETTINGS = ['content', 'color', 'alpha', 'size', 'gap', 'font', 'mosaic-brush', 'mosaic-block'];

    // 恢复上次的水印设置
    restoreSettings();

    document.addEventListener('change', function (ev) {
        if (ev.target.type === 'file') {
            if (ev.target.files.length) handleFile(ev.target.files[0]);
        } else {
            saveSettings();
            scheduleRepaint();
        }
    });

    // 拖拽图片到页面任意位置即可打开（用深度计数避免子元素间的高亮闪烁）
    var dragDepth = 0;
    document.addEventListener('dragenter', function (ev) {
        if (!hasFiles(ev.dataTransfer)) return;
        ev.preventDefault();
        if (dragDepth++ === 0) document.body.classList.add('dragging');
    });
    document.addEventListener('dragover', function (ev) {
        if (hasFiles(ev.dataTransfer)) ev.preventDefault(); // 必须 preventDefault 才会触发 drop
    });
    document.addEventListener('dragleave', function () {
        if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); }
    });
    document.addEventListener('drop', function (ev) {
        ev.preventDefault();
        dragDepth = 0;
        document.body.classList.remove('dragging');
        var files = ev.dataTransfer && ev.dataTransfer.files;
        if (files && files.length) handleFile(files[0]);
    });

    function hasFiles(dt) {
        return dt && dt.types && Array.prototype.indexOf.call(dt.types, 'Files') !== -1;
    }

    function handleFile(file) {
        if (!file || file.type.indexOf('image/') !== 0) return; // 只接受图片
        loadImage(file, function (result) {
            img = result;
            strokes = [];
            activeStroke = null;
            updateMosaicButtons();
            scheduleRepaint();
        });
    }
    // range 滑块拖动时实时预览（input 事件），但节流到每帧一次
    document.addEventListener('input', function (ev) {
        if (ev.target.tagName === 'INPUT') scheduleRepaint();
    });

    var mainCanvas = document.getElementsByTagName('canvas')[0];

    function getCanvasPoint(ev) {
        var rect = mainCanvas.getBoundingClientRect();
        var borderLeft = mainCanvas.clientLeft || 0;
        var borderTop = mainCanvas.clientTop || 0;
        var contentW = mainCanvas.clientWidth || (rect.width - borderLeft * 2);
        var contentH = mainCanvas.clientHeight || (rect.height - borderTop * 2);
        return {
            x: (ev.clientX - rect.left - borderLeft) * (mainCanvas.width / contentW),
            y: (ev.clientY - rect.top - borderTop) * (mainCanvas.height / contentH)
        };
    }

    function updateMosaicButtons() {
        var empty = strokes.length === 0;
        document.getElementById('mosaic-undo').disabled = empty;
        document.getElementById('mosaic-clear').disabled = empty;
    }

    mainCanvas.addEventListener('pointerdown', function (ev) {
        if (!img || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
        ev.preventDefault();
        if (mainCanvas.setPointerCapture) mainCanvas.setPointerCapture(ev.pointerId);
        var maxSize = Math.max(img.height, img.width);
        var brushWidth = document.getElementById('mosaic-brush').value * maxSize / 100;
        activeStroke = {
            pointerId: ev.pointerId,
            width: brushWidth,
            points: [getCanvasPoint(ev)]
        };
        strokes.push(activeStroke);
        updateMosaicButtons();
        scheduleRepaint();
    });

    mainCanvas.addEventListener('pointermove', function (ev) {
        if (!activeStroke || ev.pointerId !== activeStroke.pointerId) return;
        ev.preventDefault();
        activeStroke.points.push(getCanvasPoint(ev));
        scheduleRepaint();
    });

    function endStroke(ev) {
        if (!activeStroke || ev.pointerId !== activeStroke.pointerId) return;
        activeStroke = null;
    }
    mainCanvas.addEventListener('pointerup', endStroke);
    mainCanvas.addEventListener('pointercancel', endStroke);

    document.getElementById('mosaic-undo').addEventListener('click', function () {
        if (!strokes.length) return;
        strokes.pop();
        activeStroke = null;
        updateMosaicButtons();
        scheduleRepaint();
    });

    document.getElementById('mosaic-clear').addEventListener('click', function () {
        if (!strokes.length) return;
        strokes = [];
        activeStroke = null;
        updateMosaicButtons();
        scheduleRepaint();
    });

    var rafId = null;
    function scheduleRepaint() {
        if (rafId) return;
        rafId = requestAnimationFrame(function () {
            rafId = null;
            repaint();
        });
    }

    function drawMosaic(ctx, maxSize) {
        if (!strokes.length) return;
        var blockSize = Math.max(4, Math.round(document.getElementById('mosaic-block').value * maxSize / 200));
        if (cachedTileImg !== img || cachedBlockSize !== blockSize) {
            var tileW = Math.max(1, Math.round(img.width / blockSize));
            var tileH = Math.max(1, Math.round(img.height / blockSize));
            mosaicTileCanvas.width = tileW;
            mosaicTileCanvas.height = tileH;
            mosaicTileCanvas.getContext('2d').drawImage(img, 0, 0, tileW, tileH);
            cachedTileImg = img;
            cachedBlockSize = blockSize;
        }

        mosaicMaskCanvas.width = img.width;
        mosaicMaskCanvas.height = img.height;
        var maskCtx = mosaicMaskCanvas.getContext('2d');
        maskCtx.lineCap = 'round';
        maskCtx.lineJoin = 'round';
        maskCtx.strokeStyle = '#000';

        for (var i = 0; i < strokes.length; i++) {
            var s = strokes[i];
            var pts = s.points;
            if (!pts.length) continue;
            maskCtx.lineWidth = s.width;
            maskCtx.beginPath();
            maskCtx.moveTo(pts[0].x, pts[0].y);
            if (pts.length === 1) {
                maskCtx.lineTo(pts[0].x + 0.01, pts[0].y);
            } else {
                for (var j = 1; j < pts.length; j++) {
                    maskCtx.lineTo(pts[j].x, pts[j].y);
                }
            }
            maskCtx.stroke();
        }

        maskCtx.globalCompositeOperation = 'source-in';
        maskCtx.imageSmoothingEnabled = false;
        maskCtx.drawImage(mosaicTileCanvas, 0, 0, img.width, img.height);
        ctx.drawImage(mosaicMaskCanvas, 0, 0);
    }

    function repaint() {
        if (!img) return;
        var canvas = mainCanvas;
        var ctx = canvas.getContext('2d');
        // 重设尺寸会自动清空画布并复位变换矩阵
        canvas.width = img.width;
        canvas.height = img.height;
        canvas.style.height = (img.height / img.width) * 100 + '%';

        var maxSize = Math.max(img.height, img.width);
        ctx.drawImage(img, 0, 0);
        drawMosaic(ctx, maxSize);

        ctx.fillStyle = document.getElementById('color').value;
        ctx.globalAlpha = document.getElementById('alpha').value / 100;
        var size = document.getElementById('size').value * maxSize / 100;
        ctx.font = size + 'px "' + document.getElementById('font').value + '"';
        ctx.textBaseline = 'middle';

        var content = document.getElementById('content').value;
        if (!content.length) return;

        // 在旋转坐标系里平铺水印，用 save/restore 隔离变换
        ctx.save();
        ctx.rotate(-45 * Math.PI / 180);
        var gap = size * document.getElementById('gap').value / 100;
        var limit = Math.sqrt(2 * maxSize * maxSize);
        var textWidth = ctx.measureText(content).width;
        for (var y = -maxSize, even = false; y <= limit; y += size + gap, even = !even) {
            var offset = even ? textWidth / 2 : 0;
            for (var x = -maxSize - offset; x <= limit + offset; x += textWidth + size) {
                ctx.fillText(content, x, y);
            }
        }
        ctx.restore();
    }

    // 点保存时才生成 dataURL（toDataURL 较慢，不放在每帧预览里）
    document.getElementById('save').addEventListener('click', function (ev) {
        if (!img) return; // 未打开图片时保留提示行为
        ev.currentTarget.href = document.getElementsByTagName('canvas')[0].toDataURL('image/png');
    });

    // 优先用 createImageBitmap 并按 EXIF 方向纠正（修复手机竖拍照片被转向的问题）
    function loadImage(blob, callback) {
        if (window.createImageBitmap) {
            createImageBitmap(blob, {imageOrientation: 'from-image'})
                .then(callback)
                .catch(function () { loadImageFallback(blob, callback); });
        } else {
            loadImageFallback(blob, callback);
        }
    }

    function loadImageFallback(blob, callback) {
        var el = document.createElement('img');
        var url = URL.createObjectURL(blob);
        el.addEventListener('load', function () {
            URL.revokeObjectURL(url); // 用完释放，避免内存泄漏
            callback(el);
        });
        el.src = url;
    }

    function saveSettings() {
        try {
            var data = {};
            SETTINGS.forEach(function (id) { data[id] = document.getElementById(id).value; });
            localStorage.setItem(STORE_KEY, JSON.stringify(data));
        } catch (e) { /* localStorage 不可用时忽略 */ }
    }

    function restoreSettings() {
        try {
            var data = JSON.parse(localStorage.getItem(STORE_KEY));
            if (!data) return;
            SETTINGS.forEach(function (id) {
                if (data[id] != null) document.getElementById(id).value = data[id];
            });
        } catch (e) { /* 忽略损坏的数据 */ }
    }

    console.log("感谢提供的源码：https://github.com/zsxeee/Watermark-helper.git");
</script>
</body>
</html>
